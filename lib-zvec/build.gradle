plugins {
    id 'io.seqera.java-library-conventions'
}

version = project.findProperty('version') != 'unspecified' ? project.findProperty('version') : file('VERSION').text.trim()

dependencies {
    testImplementation libs.groovy
    testImplementation libs.spock.core
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.library.path', project.findProperty('nativeLibPath') ?: "${rootProject.projectDir}/native/build"
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showCauses true
        showStackTraces true
    }
}

