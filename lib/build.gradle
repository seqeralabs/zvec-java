plugins {
    id 'groovy'
    id 'java-library'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation libs.groovy
    testImplementation libs.spock.core
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.library.path', project.findProperty('nativeLibPath') ?: "${rootProject.projectDir}/native/build"
}

// Task to build the native C bridge via CMake
tasks.register('buildNative') {
    description = 'Builds the native C bridge library using CMake'
    group = 'build'

    doLast {
        exec {
            workingDir "${rootProject.projectDir}/native"
            commandLine 'cmake', '-B', 'build', '-S', '.'
        }
        exec {
            workingDir "${rootProject.projectDir}/native"
            commandLine 'cmake', '--build', 'build'
        }
    }
}
